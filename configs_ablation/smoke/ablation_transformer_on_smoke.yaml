exp_name: transformer_on_smoke
seed: 20260424
data:
  dataset_root: /data/PF_ATIME_dataset
  train_shots: meta/split_by_order_betan/train_shots.txt
  val_shots: meta/split_by_order_betan/val_shots.txt
  test_shots: meta/split_by_order_betan/test_shots.txt
  norm_stats: meta/split_by_order_betan/norm_stats_notime.npz
  T_max: 128
  num_workers: 8
  pin_memory: true
  prefetch_factor: 4
  persistent_workers: true
  train_subset_n: 1000
  val_subset_n: 200
model:
  name: transformer
  pe_mode: time
  d_state: 19
  d_action: 12
  d_model: 64
  dropout: 0.1
  T_max: 128
  pe_base_period_s: 20.0
  causal: true
  n_layers: 2
  n_heads: 4
  d_ff: 256
optim:
  lr: 0.0003
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.95
  grad_clip: 1.0
  amp_dtype: bf16
  epochs: 3
  batch_per_rank: 16
  scheduler: onecycle
  warmup_pct: 0.1
log:
  out_root: results/betan_ablation/transformer_on
  tb_dir: results/betan_ablation/transformer_on/tb
  log_every: 20
  save_every_epoch: 1
ddp:
  backend: nccl
  find_unused_parameters: false
