# transformer_bidir_on 在【按炮号时序划分】(meta/split_by_order) 上的重训配置.
# 与 configs_ablation/ablation_transformer_bidir_on.yaml 【模型完全一致】(双向 Transformer
# + 物理时间正弦 PE, d_state=19, causal=false), 仅改 data 划分与 norm_stats (指向 split_by_order),
# 并保留 seed=44 —— 这样相对 paper_best_timepe (transformer_bidir_on s44, 规范随机划分) 唯一
# 改变的就是 train/val/test 划分, 用于检验前向(更新 campaign)泛化能力.
#
# norm_stats 必须只用 temporal train 重算: meta/split_by_order/norm_stats_notime.npz (已生成).
#
# 用法:
#   torchrun --standalone --nnodes=1 --nproc_per_node=8 \
#       -m ablation.training.train \
#       --config configs_ablation/ablation_transformer_bidir_on_temporal.yaml --tag temporal_s44
exp_name: transformer_bidir_on_temporal
seed: 44

data:
  dataset_root: /data/PF_ATIME_dataset
  train_shots: meta/split_by_order/train_shots.txt
  val_shots:   meta/split_by_order/val_shots.txt
  test_shots:  meta/split_by_order/test_shots.txt
  norm_stats:  meta/split_by_order/norm_stats_notime.npz
  T_max: 128
  num_workers: 6
  pin_memory: true
  prefetch_factor: 4
  persistent_workers: true

model:
  name: transformer
  pe_mode: time
  d_state: 19
  d_action: 12
  d_model: 256
  dropout: 0.1
  T_max: 128
  pe_base_period_s: 20.0
  causal: false
  n_layers: 6
  n_heads: 8
  d_ff: 1024

optim:
  lr: 0.0003
  weight_decay: 0.01
  betas: [0.9, 0.95]
  grad_clip: 1.0
  amp_dtype: bf16
  epochs: 60
  batch_per_rank: 32
  scheduler: onecycle
  warmup_pct: 0.05

log:
  out_root: results/temporal_generalization
  tb_dir: results/temporal_generalization/tb
  log_every: 50
  save_every_epoch: 5

ddp:
  backend: nccl
  find_unused_parameters: false
